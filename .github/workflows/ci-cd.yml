name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: self-hosted

    env:
      DOCKER_HUB_REPO: kastrov/techsolutions-app
      NAMESPACE: default
      APP_NAME: techsolutions

    steps:

      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t $DOCKER_HUB_REPO:${{ github.sha }} \
            -t $DOCKER_HUB_REPO:latest \
            .

      # 4. Push Docker image
      - name: Push Docker Image
        run: |
          docker push $DOCKER_HUB_REPO:${{ github.sha }}
          docker push $DOCKER_HUB_REPO:latest

      # 5. Check Kubernetes cluster
      - name: Check Kubernetes
        run: |
          kubectl config current-context
          kubectl get nodes

      # 6. Update image in Deployment
      - name: Update Kubernetes Image
        run: |
          sed -i.bak \
            "s|kastrov/techsolutions-app:latest|$DOCKER_HUB_REPO:${{ github.sha }}|g" \
            k8s/deployment.yaml

      # 7. Deploy application
      - name: Deploy Application
        run: |
          kubectl apply -f k8s/deployment.yaml

      # 8. Wait for deployment
      - name: Check Deployment
        run: |
          kubectl rollout status deployment/$APP_NAME-deployment \
            --timeout=300s

      # 9. Check Pods and Service
      - name: Check Kubernetes Resources
        run: |
          kubectl get pods -l app=$APP_NAME
          kubectl get svc $APP_NAME-service

      # 10. Deploy Ingress
      - name: Deploy Ingress
        run: |
          kubectl apply -f k8s/ingress.yaml

      # 11. Check Ingress
      - name: Check Ingress
        run: |
          kubectl get ingress
          kubectl describe ingress $APP_NAME-ingress