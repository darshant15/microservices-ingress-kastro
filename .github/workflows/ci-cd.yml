name: Docker Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/techsolutions-app

    steps:
      # 1. Checkout source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Validate required files
      - name: Validate Application Files
        run: |
          test -f Dockerfile
          test -f nginx.conf
          test -f index.html
          echo "Required files are available"

      # 3. Validate GitHub secrets
      - name: Validate Docker Secrets
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          test -n "$DOCKER_USERNAME" || {
            echo "DOCKER_USERNAME is missing"
            exit 1
          }

          test -n "$DOCKER_PASSWORD" || {
            echo "DOCKER_PASSWORD is missing"
            exit 1
          }

          echo "Docker secrets are available"

      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build and push image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
